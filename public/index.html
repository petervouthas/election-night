<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election Night 2026</title>
<style>
:root {
  --bg: #070a0f; --panel: #0c1117; --panel2: #111820; --line: #1a2230; --line2: #263244;
  --ink: #dde4ed; --ink2: #93a1b3; --ink3: #5a6a7e;
  --dem: #3d8bff; --dem-lead: #245aa8; --dem-dim: #17315c;
  --rep: #ff4d4d; --rep-lead: #a83232; --rep-dim: #5a1f1f;
  --oth: #a78bfa;
  --over: #2bd576; --under: #ffae1a;
  --none: #1c2532;
  --mono: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 12px/1.35 var(--mono); font-size: calc(12px * var(--ui)); height: 100%; }
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
:root { --ui: 1; --left-w: 60%; --races-h: 440px; --polls-h: 150px; --side-w: 500px; }
a { color: var(--ink2); text-decoration: none; }
button { font: inherit; color: var(--ink2); background: var(--panel2); border: 1px solid var(--line2); padding: 3px 9px; cursor: pointer; border-radius: 2px; }
button:hover { color: var(--ink); border-color: var(--ink3); }
button.on { color: var(--ink); background: var(--line2); border-color: var(--ink3); }
button:focus-visible, [contenteditable]:focus-visible { outline: 1px solid var(--ink2); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }
.d { color: var(--dem); } .r { color: var(--rep); } .o { color: var(--oth); }
.over { color: var(--over); } .under { color: var(--under); }
.muted { color: var(--ink3); } .dim { color: var(--ink2); }

/* header */
#hdr { display: flex; align-items: center; gap: 18px; height: calc(30px * var(--ui)); padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; white-space: nowrap; overflow: hidden; }
#hdr > * { flex: none; }
#hdr .title { color: var(--ink); letter-spacing: .04em; }
#hdr #nextclose { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#hdr .clock { font-size: calc(15px * var(--ui)); color: var(--ink); }
#hdr .spacer { flex: 1; }
#hdr .tabs { display: flex; border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; background: var(--panel2); }
#hdr .tabs::before { content: attr(data-label); color: var(--ink3); font-size: calc(10px * var(--ui)); padding: 0 7px; display: flex; align-items: center; background: var(--panel); border-right: 1px solid var(--line2); }
#hdr .tabs button { border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; padding: 2px 8px; }
#hdr .tabs button:last-child { border-right: 0; }
#hdr .src { display: flex; gap: 14px; color: var(--ink3); flex: 0 1 auto; min-width: 0; overflow: hidden; }
#hdr .src > span { white-space: nowrap; }
#hdr .src b { color: var(--ink2); font-weight: 500; }
#hdr .src .stale { color: var(--under); }
#hdr .src .dead { color: var(--rep); }
#live { width: 7px; height: 7px; border-radius: 50%; background: var(--over); display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
@media (prefers-reduced-motion: reduce) { #live { animation: none } }

/* top bar */
#top { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); flex: none; }
#gb { display: none; }
/* the national "US" row: a regular row, pinned under the header */
tr.national td { position: sticky; top: calc(24px * var(--ui)); z-index: 1; background: var(--panel); border-bottom: 1px solid var(--line2); }
tr.national td.race { color: var(--ink); }
tr:hover.national td { background: var(--panel2); }
.chamber { padding: 6px 14px 6px; border-right: 1px solid var(--line); display: grid; grid-template-columns: auto auto 1fr; grid-template-rows: auto auto; column-gap: 18px; align-items: end; }
.chamber .kp { display: flex; flex-direction: column; gap: 1px; padding-bottom: 4px; color: var(--ink2); font-size: calc(12px * var(--ui)); }
.chamber .lbl .chip { margin-left: 10px; font-size: calc(11px * var(--ui)); letter-spacing: 0; padding: 0 5px; border: 1px solid var(--line2); border-radius: 2px; }
.chamber .lbl .chip small { color: var(--ink3); margin-left: 3px; }
.chamber .lbl .chip.flat { color: var(--ink3); }
.chamber .kp b { font-weight: 500; }
.chamber:last-child { border-right: 0; }
.chamber .lbl { grid-column: 1 / -1; color: var(--ink2); letter-spacing: .08em; font-size: calc(11px * var(--ui)); display: flex; gap: 14px; align-items: baseline; }
.chamber .lbl .fav { color: var(--ink); }
.big { font-size: calc(46px * var(--ui)); line-height: 1; font-weight: 500; letter-spacing: -.02em; }
.big small { font-size: calc(18px * var(--ui)); color: var(--ink3); font-weight: 400; margin-left: 1px; }
.odds { display: flex; flex-direction: column; }
.odds .cap { color: var(--ink3); font-size: calc(11px * var(--ui)); margin-top: 4px; }
.odds .cap b { color: var(--ink2); font-weight: 500; }
.spread { display: flex; flex-direction: column; align-self: end; padding-bottom: 4px; }
.spread .v { font-size: calc(22px * var(--ui)); color: var(--ink); }
.spread .cap { color: var(--ink3); font-size: calc(11px * var(--ui)); }
.spark { align-self: end; justify-self: end; }
.spark svg { display: block; }
.seats { grid-column: 1 / -1; margin-top: 8px; display: flex; align-items: center; gap: 12px; color: var(--ink2); }
.seats .bar { flex: 1 1 160px; min-width: 120px; height: 8px; background: var(--none); position: relative; display: flex; overflow: hidden; }
.seats > .muted { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seats .bar span { height: 100%; display: block; }
.seats .bar .maj { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink); }
.seats .cnt { white-space: nowrap; }
.seats .cnt b { font-weight: 500; font-size: calc(14px * var(--ui)); }

.gb { padding: 8px 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 16px; row-gap: 3px; align-content: start; }
.gb .lbl { grid-column: 1 / -1; color: var(--ink2); letter-spacing: .08em; font-size: calc(11px * var(--ui)); }
.gb .k { color: var(--ink3); white-space: nowrap; }
.gb .v { color: var(--ink); text-align: right; white-space: nowrap; }
.gb .v.big2 { font-size: calc(26px * var(--ui)); line-height: 1; }
.gb .v small { color: var(--ink3); font-size: calc(11px * var(--ui)); margin-left: 6px; }

/* main */
/* locked: header + odds bar. scrolling: each column region scrolls on its own. */
#main { display: grid; grid-template-columns: minmax(240px, var(--left-w)) 6px minmax(240px, 1fr); flex: 1; min-height: 0; }
#left { display: grid; grid-template-rows: minmax(80px, var(--races-h)) 6px minmax(80px, 1fr); min-width: 0; min-height: 0; order: 0; }
#right { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; order: 2; }
#rz-cols { order: 1; }

/* drag handles */
.rz { background: var(--line); position: relative; z-index: 2; touch-action: none; user-select: none; }
.rz::after { content: ""; position: absolute; inset: 0; margin: auto; background: var(--line2); border-radius: 2px; }
.rz-v { cursor: col-resize; width: 6px; }
.rz-v::after { width: 2px; height: 28px; }
.rz-h { cursor: row-resize; height: 6px; }
.rz-h::after { height: 2px; width: 28px; }
.rz:hover, .rz.active { background: var(--line2); }
.rz:hover::after, .rz.active::after { background: var(--ink2); }
body.resizing { cursor: inherit; user-select: none; }
body.resizing iframe { pointer-events: none; }

/* theater: stream fills the height, key figures in one strip under it, compact table in a narrow sidebar */
body.theater #top { display: none; }
body.theater #main { grid-template-columns: minmax(240px, 1fr) 6px minmax(120px, var(--side-w)); }
body.theater #right { order: 0; overflow: hidden; }
body.theater #left { order: 2; grid-template-rows: minmax(0, 1fr) auto auto auto; }
body.theater #left #links { border-top: 1px solid var(--line); border-bottom: 0; }
body.theater #rz-races, body.theater #views, body.theater #rz-polls, body.theater #log, body.theater #loghdr { display: none; }
body.theater #left #pollshdr { border-top: 1px solid var(--line); }
body.theater #left #polls { height: auto; flex: 1; min-height: 120px; max-height: 40vh; }
/* phones: an app layout. Fixed header, one page at a time (Game / Odds / Races / Map / Feed), bottom tab bar. */
#mnav { display: none; }
@media (max-width: 900px) {
  html, body { height: 100%; overflow: hidden; }
  body.phone { height: 100dvh; display: flex; flex-direction: column; }
  body.phone #hdr { gap: 10px; padding: 0 12px; height: calc(34px * var(--ui)); }
  body.phone #hdr .src, body.phone #hdr #nextclose, body.phone #hdr #theater, body.phone #hdr #fullscreen, body.phone #hdr #resetlayout, body.phone #hdr #savesetup, body.phone #hdr #uictl, body.phone #hdr #gamebtn { display: none; }
  body.phone #hdr .title { font-size: calc(11px * var(--ui)); }
  body.phone #mnav { display: flex; flex: none; border-top: 1px solid var(--line2); background: var(--panel); padding-bottom: env(safe-area-inset-bottom); }
  body.phone #mnav button { flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--ink3); padding: 10px 0 9px; font-size: calc(12px * var(--ui)); letter-spacing: .04em; min-height: 46px; }
  body.phone #mnav button + button { border-left: 1px solid var(--line); }
  body.phone #mnav button.on { color: var(--ink); background: var(--line); box-shadow: inset 0 2px 0 var(--dem); }
  /* pages */
  body.phone #top, body.phone #main, body.phone #gamewrap, body.phone #racewrap, body.phone #rz-races, body.phone #views, body.phone #embedhdr, body.phone #embed, body.phone #keyfigs, body.phone #links, body.phone #pollshdr, body.phone #polls, body.phone #rz-polls, body.phone #loghdr, body.phone #log, body.phone #rz-cols { display: none; }
  body.phone #main { flex: 1; min-height: 0; flex-direction: column; }
  body.phone #left, body.phone #right { display: contents; }
  body.phone[data-mpage="odds"] #top { display: block; flex: none; overflow: visible; }
  body.phone[data-mpage="odds"] #main { display: flex; overflow: auto; }
  body.phone[data-mpage="odds"] #links { display: flex; flex-wrap: wrap; }
  body.phone[data-mpage="odds"] #loghdr { display: flex; }
  body.phone[data-mpage="odds"] #log { display: block; flex: none; max-height: 30vh; }
  body.phone[data-mpage="races"] #main { display: flex; }
  body.phone[data-mpage="races"] #racewrap { display: flex; flex: 1; min-height: 0; }
  body.phone[data-mpage="map"] #main { display: flex; }
  body.phone[data-mpage="map"] #views { display: flex; flex: 1; min-height: 0; }
  body.phone[data-mpage="feed"] #main { display: flex; }
  body.phone[data-mpage="feed"] #pollshdr { display: flex; }
  body.phone[data-mpage="feed"] #polls { display: block; flex: 1; min-height: 0; height: auto; overflow: auto; }
  body.phone[data-mpage="game"] #gamewrap { display: flex; position: static; flex: 1; min-height: 0; }
  body.phone #gamehdr #gameclose { display: none; }
  body.phone #gamewrap #game { padding: 8px; }
  /* odds page */
  body.phone #top { grid-template-columns: minmax(0, 1fr); }
  body.phone .chamber { border-right: 0; border-bottom: 1px solid var(--line); grid-template-columns: minmax(0, auto) minmax(0, auto) minmax(0, 1fr); column-gap: 12px; padding: 8px 12px; min-width: 0; overflow: hidden; }
  body.phone .chamber .odds, body.phone .chamber .spread { min-width: 0; }
  body.phone .chamber .spark { grid-column: 1 / -1; justify-self: start; margin-top: 4px; }
  body.phone .big { font-size: calc(38px * var(--ui)); }
  body.phone .big small { font-size: calc(14px * var(--ui)); }
  body.phone .seats > .muted { white-space: normal; }
  body.phone #links { padding: 8px 12px; gap: 8px; }
  /* panel headers scroll sideways instead of wrapping or shrinking */
  body.phone .ph { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
  body.phone .ph::-webkit-scrollbar { display: none; }
  body.phone #racewrap > .ph { flex-wrap: nowrap; }
  body.phone .ph .tabs button { padding: 6px 10px; min-height: 36px; }
  body.phone .ph button { min-height: 36px; }
  body.phone .ph.ctl { min-height: 0; padding: 4px 8px; }
  body.phone .ph.ctl .row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  body.phone .ph.ctl .row::-webkit-scrollbar { display: none; }
  body.phone .ph .tabs.ghost { display: none; }      /* hidden instead of invisible: no dead space on a small screen */
  body.phone #racemeta, body.phone #racewrap > .ph > .muted { display: none; }
  /* race table: scrolls both ways, race id column stays put */
  body.phone #races { overflow: auto; -webkit-overflow-scrolling: touch; }
  body.phone td, body.phone th { padding: 6px 8px; height: calc(34px * var(--ui)); }
  body.phone th:first-child, body.phone td.race { position: sticky; left: 0; z-index: 2; background: var(--bg); }
  body.phone th:first-child { z-index: 3; }
  body.phone tr.national td.race { z-index: 3; }
  body.phone tr.national td { background: var(--panel); }
  body.phone tr:hover td { background: inherit; }
  /* views */
  body.phone #viewbody { padding: 8px; }
  body.phone #map svg, body.phone #hex svg { touch-action: none; }
  body.phone .legend { white-space: normal; }
  body.phone #tape { display: none !important; }
  body.phone #toast { max-width: calc(100vw - 24px); }
  body.phone #colpick { max-width: calc(100vw - 16px); }
}
body.theater #embed { aspect-ratio: auto; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
body.theater #embed iframe { position: static; }
body.theater td, body.theater th { padding-left: 5px; padding-right: 5px; }
body.theater #keyfigs { display: grid; }
#keyfigs { display: none; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
#keyfigs .cell { padding: 6px 12px; border-right: 1px solid var(--line); display: grid; grid-template-columns: auto auto auto 1fr; column-gap: 14px; align-items: end; }
#keyfigs .cell:last-child { border-right: 0; }
#keyfigs .lab { grid-column: 1 / -1; color: var(--ink2); letter-spacing: .08em; font-size: calc(11px * var(--ui)); }
#keyfigs .lab b { color: var(--ink); font-weight: 500; }
#keyfigs .n { font-size: calc(38px * var(--ui)); line-height: 1; font-weight: 500; letter-spacing: -.02em; }
#keyfigs .n small { font-size: calc(12px * var(--ui)); color: var(--ink3); font-weight: 400; margin-left: 2px; }
#keyfigs .sub { color: var(--ink3); font-size: calc(11px * var(--ui)); padding-bottom: 4px; }
#keyfigs .seats { grid-column: 1 / -1; margin-top: 6px; font-size: calc(11px * var(--ui)); }
#keyfigs .gbv { font-size: calc(30px * var(--ui)); }
body.theater .ph .muted { display: none; }
body.theater #racemeta { display: none; }
.ph { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-bottom: 1px solid var(--line); color: var(--ink2); letter-spacing: .06em; font-size: calc(11px * var(--ui)); background: var(--panel); flex: none; }
.ph .spacer { flex: 1; }
/* segmented control groups: a small label, then joined buttons, so each group reads as one unit */
.ph .tabs { display: flex; gap: 0; flex-wrap: nowrap; flex: none; border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; background: var(--panel2); }
.ph .tabs::before { content: attr(data-label); color: var(--ink3); font-size: calc(10px * var(--ui)); letter-spacing: .06em; padding: 0 7px; display: flex; align-items: center; background: var(--panel); border-right: 1px solid var(--line2); }
.ph .tabs:not([data-label])::before { display: none; }
.ph .tabs button { white-space: nowrap; padding: 2px 8px; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; }
.ph .tabs button:last-child { border-right: 0; }
.ph .tabs button.on { background: var(--line2); }
.ph .tabs.ghost { visibility: hidden; }          /* keeps its width, so the row never reflows */
.ph.ctl .row { gap: 14px; }
/* column header: drag to reorder, picker popover */
th .hl { cursor: grab; }
th.dragging { opacity: .4; }
th.over-l { box-shadow: inset 2px 0 0 var(--ink); }
th.over-r { box-shadow: inset -2px 0 0 var(--ink); }
#colpick { display: none; position: fixed; z-index: 20; background: var(--panel2); border: 1px solid var(--line2); padding: 8px 10px; min-width: 170px; letter-spacing: 0; white-space: normal; }
#colswrap { position: relative; flex: none; }
#colpick label { display: block; padding: 2px 0; color: var(--ink); cursor: pointer; white-space: nowrap; }
#colpick input { margin: 0 6px 0 0; vertical-align: -1px; }
#colpick .cp-title { color: var(--ink2); margin-bottom: 4px; }
#colpick .cp-foot { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
#views, #racewrap { min-width: 0; }
#left { overflow: hidden; }
/* two fixed rows of controls, so switching modes never changes the header height */
.ph.ctl { display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 4px 10px; min-height: 58px; }
.ph.ctl .row { display: flex; align-items: center; gap: 10px 14px; min-height: 22px; flex-wrap: wrap; white-space: nowrap; }
/* the two mode sub-filters share one slot sized to the wider of them, so switching modes never reflows */
.ph .slot { display: grid; flex: none; }
.ph .slot > .tabs { grid-area: 1 / 1; align-self: start; justify-self: start; }
#viewmeta { display: none; }
.ph .slot > .tabs.ghost { visibility: hidden; }
.ph.ctl #viewmeta { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
body.theater .ph.ctl { display: none; }
.legend { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; flex-wrap: nowrap; }

/* race table: scrolls inside its region, header stays */
#racewrap { display: flex; flex-direction: column; min-height: 0; }
#racewrap > .ph { white-space: nowrap; flex-wrap: wrap; row-gap: 4px; }
#racewrap > .ph > .muted { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#racewrap > .ph > .tabs, #racewrap > .ph > span:last-child { flex: none; }
#races { flex: 1; min-height: 0; overflow: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: right; color: var(--ink3); font-weight: 400; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: calc(11px * var(--ui)); position: sticky; top: 0; background: var(--bg); }
th:first-child, th.l, td.l { text-align: left; }
th[data-k] { cursor: pointer; user-select: none; }
th[data-k]:hover { color: var(--ink2); }
th.sorted { color: var(--ink); }
th.sorted::before { content: "▲ "; font-size: calc(8px * var(--ui)); color: var(--ink2); }
th.sorted.desc::before { content: "▼ "; }
table.fixed { table-layout: fixed; }
table.fixed td { overflow: hidden; text-overflow: ellipsis; }
.cr { position: absolute; right: -5px; top: 0; bottom: 0; width: 10px; cursor: col-resize; z-index: 1; -webkit-user-drag: none; user-select: none; }
.cr::after { content: ""; position: absolute; left: 4px; top: 25%; bottom: 25%; width: 1px; background: var(--line2); }
.cr:hover::after, .cr.active::after { background: var(--ink2); width: 2px; }
body.theater #rz-polls { display: none; }
td { padding: 3px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; height: calc(25px * var(--ui)); }
tr:hover td { background: var(--panel2); }
td.race { font-weight: 500; color: var(--ink); }
td.race a.rid { color: var(--ink); cursor: pointer; }
td.race a.rid:hover { text-decoration: underline; }
td.sig { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
td.edit { cursor: text; position: relative; }
td.edit[data-override="1"]::after { content: ""; position: absolute; right: 2px; top: 50%; margin-top: -2px; width: 4px; height: 4px; border-radius: 50%; background: var(--ink2); }
td.edit:hover { background: var(--line) !important; }
td .cands { color: var(--ink3); font-size: calc(11px * var(--ui)); }
.call { display: inline-block; width: 8px; height: 8px; border-radius: 1px; vertical-align: -1px; margin-right: 6px; background: var(--none); }
.call.D { background: var(--dem); } .call.R { background: var(--rep); } .call.O { background: var(--oth); }
.call.lD { background: var(--dem-lead); } .call.lR { background: var(--rep-lead); } .call.lO { background: #6b56b8; } .call.RO { background: #8a6d1f; }
.rpt { color: var(--ink3); }

/* predictions game: full-page panel over the dashboard on desktop, its own page on phones */
#gamewrap { display: none; position: fixed; left: 0; right: 0; bottom: 0; top: calc(30px * var(--ui)); z-index: 40; background: var(--bg); flex-direction: column; }
body.gameopen #gamewrap { display: flex; }
#gamewrap #game { flex: 1; min-height: 0; overflow: auto; padding: 10px; }
#gamehdr .title { color: var(--ink); letter-spacing: .08em; }
#gamebtn.on { color: var(--ink); background: var(--line2); border-color: var(--ink3); }
/* state tile grid (cartogram view for Senate/Governor, game Senate map) */
svg.tiles .tile text { fill: var(--ink); pointer-events: none; font-family: var(--mono); }
svg.tiles .tile text.sub { fill: var(--ink); opacity: .85; }
svg.tiles .tile.none text { fill: var(--ink3); }
svg.tiles .tile.none rect { fill: var(--none); }
svg.tiles .tile rect { stroke: var(--bg); stroke-width: 1; }
svg.tiles .tile.has { cursor: pointer; }
svg.tiles .tile.has:hover rect { stroke: var(--ink); stroke-width: 1.5; }
/* views */
#views { min-height: 0; display: flex; flex-direction: column; }
#viewbody { flex: 1; min-height: 0; overflow: auto; padding: 10px; position: relative; }
.strip { margin-bottom: 14px; }
.strip .cap { display: flex; gap: 14px; color: var(--ink2); margin-bottom: 6px; align-items: baseline; white-space: nowrap; overflow: hidden; }
.strip .cap > span { overflow: hidden; text-overflow: ellipsis; }
.strip .cap b { color: var(--ink); font-weight: 500; font-size: calc(14px * var(--ui)); }
.strip svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 14px; color: var(--ink3); margin-top: 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; }
#viewbody.fill { overflow: hidden; display: flex; flex-direction: column; }
#viewbody.fill > div { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#map svg, #hex svg { width: 100%; height: 100%; flex: 1; min-height: 0; display: block; cursor: grab; }
#map svg:active, #hex svg:active { cursor: grabbing; }
#map .legend, #hex .legend { flex: none; }
#map path, #hex path { stroke: var(--bg); stroke-width: .7; }
#map path.d, #hex path.d { stroke-width: .35; }
#map path:hover, #hex path:hover { stroke: var(--ink); stroke-width: 1.2; }
#map path.outline, #hex path.outline { fill: none; stroke: var(--ink2); stroke-width: 1; pointer-events: none; }
#map path.outline:hover, #hex path.outline:hover { stroke-width: 1; }
#tip { position: fixed; pointer-events: none; background: var(--panel2); border: 1px solid var(--line2); padding: 6px 9px; font-size: calc(11px * var(--ui)); color: var(--ink); display: none; z-index: 10; max-width: 340px; white-space: nowrap; }
#tip .t { color: var(--ink); margin-bottom: 3px; } #tip .m { color: var(--ink2); }

/* right column */
#embed { flex: none; background: #000; aspect-ratio: 16 / 9; position: relative; }
#embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#links { display: flex; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#links a { border: 1px solid var(--line2); padding: 3px 10px; border-radius: 2px; color: var(--ink2); background: var(--panel2); }
#links a:hover { color: var(--ink); border-color: var(--ink3); }
#polls { padding: 4px 10px; color: var(--ink2); font-size: calc(11px * var(--ui)); height: var(--polls-h); overflow: auto; flex: none; }
#pollshdr { white-space: nowrap; }
#pollshdr #feedmeta { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ph button { white-space: nowrap; }
/* event feed */
#polls .ev { display: grid; grid-template-columns: 44px 10px 1fr auto; gap: 8px; align-items: baseline; padding: 2px 0; border-bottom: 1px solid var(--line); }
#polls .ev .t { color: var(--ink3); }
#polls .ev .sq { width: 8px; height: 8px; border-radius: 1px; background: var(--none); align-self: center; }
#polls .ev .sq.D { background: var(--dem); } #polls .ev .sq.R { background: var(--rep); } #polls .ev .sq.O { background: var(--oth); }
#polls .ev .x { color: var(--ink); }
#polls .ev .x .tag { font-size: calc(10px * var(--ui)); padding: 0 4px; border: 1px solid var(--line2); border-radius: 2px; margin-left: 6px; color: var(--ink2); }
#polls .ev .x .tag.flip { color: var(--under); border-color: var(--under); }
#polls .ev.control .x { font-size: calc(13px * var(--ui)); font-weight: 500; }
#polls .ev a { color: var(--ink2); cursor: pointer; }
#polls .ev a:hover { color: var(--ink); text-decoration: underline; }
#polls .ev.new .x { animation: evin 1.2s ease-out; }
@keyframes evin { 0% { background: var(--line2); } 100% { background: transparent; } }
/* table row flash on an event */
tr.flash-d td { animation: flashd 2s ease-out; box-shadow: inset 2px 0 0 var(--dem); }
tr.flash-r td { animation: flashr 2s ease-out; box-shadow: inset 2px 0 0 var(--rep); }
@keyframes flashd { 0% { background: rgba(61,139,255,.28); } 100% { background: transparent; } }
@keyframes flashr { 0% { background: rgba(255,77,77,.28); } 100% { background: transparent; } }
/* ticker tape */
#tape { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: calc(24px * var(--ui)); background: var(--panel); border-top: 1px solid var(--line2); overflow: hidden; z-index: 50; white-space: nowrap; }
body.has-tape #main { margin-bottom: calc(24px * var(--ui)); }
#tape .track { display: inline-block; padding-left: 100%; animation: tape 60s linear infinite; line-height: calc(24px * var(--ui)); }
#tape:hover .track { animation-play-state: paused; }
#tape .it { margin-right: 36px; cursor: pointer; }
#tape .it .t { color: var(--ink3); margin-right: 6px; }
#tape .it.D { color: var(--dem); } #tape .it.R { color: var(--rep); } #tape .it.over { color: var(--over); } #tape .it.under { color: var(--under); } #tape .it.control { color: var(--ink); font-weight: 500; }
#tape .it.hd { color: var(--ink3); letter-spacing: .08em; margin-right: 18px; cursor: default; }
#tape .it.tick { margin-right: 22px; }
@keyframes tape { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { #tape .track { animation: none; padding-left: 10px; } }
/* catch-up toast */
#toast { display: none; position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--panel2); border: 1px solid var(--line2); padding: 10px 14px; max-width: 560px; cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
#toast .h { color: var(--ink2); margin-bottom: 4px; }
#toast .l { color: var(--ink); }
#embed { flex: none; }
#links, .ph { flex: none; }
#polls table td, #polls table th { padding: 2px 6px; height: auto; border-bottom: 0; font-size: calc(11px * var(--ui)); }
#log { flex: 1; min-height: 60px; overflow: auto; padding: 6px 10px; color: var(--ink2); font-size: calc(11px * var(--ui)); }
#log .e { display: flex; gap: 10px; padding: 1px 0; }
#log .e .t { color: var(--ink3); flex: none; } #log .e .s { color: var(--under); flex: none; width: 70px; }
#log .empty { color: var(--ink3); }
</style>
</head>

<script>
'use strict';
// ------------------------------------------------------------ helpers
const $ = s => document.querySelector(s);
const NAT_2024 = -1.48;   // 2024 national popular vote margin, D minus R (Trump +1.48)
const fmtPct = v => v === null || v === undefined || isNaN(v) ? '—' : (Math.round(v * 10) / 10).toFixed(1);
const fmtMargin = v => {
  if (v === null || v === undefined || isNaN(v)) return '<span class="muted">—</span>';
  const a = Math.abs(v).toFixed(1);
  if (Math.abs(v) < 0.05) return '<span class="dim">EVEN</span>';
  return v > 0 ? `<span class="d">D+${a}</span>` : `<span class="r">R+${a}</span>`;
};
const fmtOver = v => {
  if (v === null || v === undefined || isNaN(v)) return '<span class="muted">—</span>';
  const s = (v > 0 ? '+' : '') + v.toFixed(1);
  if (Math.abs(v) < 0.05) return `<span class="dim">0.0</span>`;
  return v > 0 ? `<span class="over">${s}</span>` : `<span class="under">${s}</span>`;
};
const ago = t => { if (!t) return '—'; const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}` : `${Math.floor(s / 3600)}h${Math.floor(s % 3600 / 60)}m`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const STATE_FIPS = { AL:'01',AK:'02',AZ:'04',AR:'05',CA:'06',CO:'08',CT:'09',DE:'10',DC:'11',FL:'12',GA:'13',HI:'15',ID:'16',IL:'17',IN:'18',IA:'19',KS:'20',KY:'21',LA:'22',ME:'23',MD:'24',MA:'25',MI:'26',MN:'27',MS:'28',MO:'29',MT:'30',NE:'31',NV:'32',NH:'33',NJ:'34',NM:'35',NY:'36',NC:'37',ND:'38',OH:'39',OK:'40',OR:'41',PA:'42',RI:'44',SC:'45',SD:'46',TN:'47',TX:'48',UT:'49',VT:'50',VA:'51',WA:'53',WV:'54',WI:'55',WY:'56' };
const FIPS_STATE = Object.fromEntries(Object.entries(STATE_FIPS).map(([k, v]) => [v, k]));

// local overrides for editable cells
const store = {
  get(k) { try { const v = localStorage.getItem('en26:' + k); return v === null ? null : JSON.parse(v); } catch { return null; } },
  set(k, v) { try { if (v === null) localStorage.removeItem('en26:' + k); else localStorage.setItem('en26:' + k, JSON.stringify(v)); } catch {} },
};

let S = null;       // /api/state
let SEATS = null;   // /api/seats
let SPEND = null;   // /api/spending (FEC, static over the night)
const fmtUSD = v => v === null || v === undefined ? '—' : v >= 1e9 ? '$' + (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? '$' + (v / 1e6).toFixed(1) + 'M' : '$' + Math.round(v / 1e3) + 'K';
const Q = new URLSearchParams(location.search);   // ?view=map&layer=senate&mode=polls for deep links
let view = Q.get('view') || store.get('view') || 'seats';
const openGameAtStart = view === 'game'; if (view === 'game') view = 'seats';
let mapLayer = Q.get('layer') || store.get('mapLayer') || 'senate';
let mapMode = Q.get('mode') || store.get('mapMode') || 'live';
let spendFilter = Q.get('spend') || store.get('spendFilter') || 'all';   // all | D | R | share
let marketSrc = Q.get('src') || store.get('marketSrc') || 'avg';         // avg | k | p
const zoomState = { map: d3.zoomIdentity, hex: d3.zoomIdentity };
let clientErrors = [];

// ------------------------------------------------------------ clock
function tickClock() {
  const now = new Date();
  $('#clock').textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour12: false }) + ' ET';
  if (S && S.nyt.pollClosing && S.nyt.pollClosing.length) {
    const upcoming = S.nyt.pollClosing.map(p => ({ st: p.state, t: Date.parse(p.t) })).filter(p => p.t > now).sort((a, b) => a.t - b.t);
    if (upcoming.length) {
      const t0 = upcoming[0].t, sts = upcoming.filter(p => p.t === t0).map(p => p.st);
      const secs = Math.round((t0 - now) / 1000), hh = Math.floor(secs / 3600), mm = Math.floor(secs % 3600 / 60), ss = secs % 60;
      $('#nextclose').textContent = `next close ${hh ? hh + ':' : ''}${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')} · ${sts.slice(0, 8).join(' ')}${sts.length > 8 ? ' +' + (sts.length - 8) : ''}`;
    } else $('#nextclose').textContent = 'all polls closed';
  }
  if (S) renderSources();
}
setInterval(tickClock, 1000);

// ------------------------------------------------------------ data
async function pullState() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    S = await r.json();
    renderAll();
  } catch (e) { clientError('page', '/api/state: ' + e.message); }
}
let HOUSE_BY_ID = {};   // "NY-17" -> condensed NYT race
let HOMES = null;        // guests' hometowns from /api/homes (for the Hometowns dataset)
async function pullHomes() {
  try { const r = await fetch('/api/homes', { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json(); const changed = JSON.stringify(j.players) !== JSON.stringify(HOMES); HOMES = j.players || []; if (changed && S && dataset === 'home') renderRaces(); }
  catch (e) { if (Date.now() - (pullHomes.err || 0) > 60000) { pullHomes.err = Date.now(); clientError('page', '/api/homes: ' + e.message); } }
}
setInterval(pullHomes, 30000); pullHomes();
async function pullSeats() {
  try {
    const r = await fetch('/api/seats', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    SEATS = await r.json();
    HOUSE_BY_ID = {};
    for (const x of SEATS.house || []) if (x.seat) HOUSE_BY_ID[`${x.state}-${parseInt(x.seat, 10) || x.seat}`] = x;
    renderView();
  } catch (e) { clientError('page', '/api/seats: ' + e.message); }
}
async function pullSpending() {
  try {
    const r = await fetch('/api/spending', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    SPEND = await r.json();
    if (SPEND && view === 'map') renderMap();
    if (SPEND && S) renderRaces();
  } catch (e) { clientError('page', '/api/spending: ' + e.message); }
}
function clientError(source, msg) { clientErrors.unshift({ t: Date.now(), source, msg }); clientErrors = clientErrors.slice(0, 20); renderLog(); }

// ------------------------------------------------------------ render: header sources
function renderSources() {
  const k = S.kalshi.updatedAt, p = S.polymarket.updatedAt, n = S.nyt.updatedAt, v = S.polls && S.polls.updatedAt;
  const cls = (t, limit) => !t ? 'dead' : (Date.now() - t > limit ? 'stale' : '');
  const mk = (name, t, limit) => `<span class="${cls(t, limit)}"><b>${name}</b> ${ago(t)}</span>`;
  const mi = S.config.pollIntervalMs || 30000, ni = S.config.nytIntervalMs || 60000;
  $('#src').innerHTML = mk('KALSHI', k, mi * 3) + mk('POLY', p, mi * 3) + mk('NYT/AP', n, ni * 3) + mk('POLLS', v, 3600e3 * 2)
    + (S.nyt.resultsUpdatedAt ? `<span><b>feed</b> ${ago(Date.parse(S.nyt.resultsUpdatedAt))}</span>` : '');
}

// ------------------------------------------------------------ render: top bar
// sparkline of the market average (K and P averaged per point; one source if the other is missing)
// diverging odds chart: market average minus 50. Democratic edge fills blue above the midline,
// Republican edge fills red below; the midline is even odds. Symmetric scale, at least ±10 pts.
function sparkline(key1, key2, w = 170, h = 40) {
  const H = S.history || [];
  const pts = H.map(x => ({ t: x.t, v: (x[key1] !== null && x[key2] !== null) ? (x[key1] + x[key2]) / 2 : (x[key1] ?? x[key2]) })).filter(p => p.v !== null && p.v !== undefined).map(p => ({ t: p.t, v: p.v - 50 }));
  if (pts.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const amp = Math.max(10, ...pts.map(p => Math.abs(p.v))) * 1.05;
  const top = 3, bot = h - 12, mid = (top + bot) / 2;
  const t0 = pts[0].t, t1 = Math.max(pts[pts.length - 1].t, t0 + 1);
  const x = t => 14 + (t - t0) / (t1 - t0) * (w - 18), y = v => mid - v / amp * (bot - top) / 2;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = `${line}L${x(pts[pts.length - 1].t).toFixed(1)},${mid.toFixed(1)}L${x(pts[0].t).toFixed(1)},${mid.toFixed(1)}Z`;
  const last = pts[pts.length - 1], cid = 'clip' + key1 + Math.round(Math.random() * 1e6);
  return `<svg width="${w}" height="${h}" role="img" aria-label="market average vs even odds, last ${(S.config.historyHours || 2)} hours">
    <defs><clipPath id="${cid}a"><rect x="0" y="0" width="${w}" height="${mid}"/></clipPath><clipPath id="${cid}b"><rect x="0" y="${mid}" width="${w}" height="${h - mid}"/></clipPath></defs>
    <path d="${area}" fill="var(--dem)" fill-opacity=".35" clip-path="url(#${cid}a)"/>
    <path d="${area}" fill="var(--rep)" fill-opacity=".35" clip-path="url(#${cid}b)"/>
    <path d="${line}" fill="none" stroke="var(--dem)" stroke-width="1.6" clip-path="url(#${cid}a)"/>
    <path d="${line}" fill="none" stroke="var(--rep)" stroke-width="1.6" clip-path="url(#${cid}b)"/>
    <line x1="14" y1="${mid}" x2="${w - 2}" y2="${mid}" stroke="var(--ink2)" stroke-width="1"/>
    <text x="1" y="${top + 8}" fill="var(--dem)" font-size="9">D</text><text x="1" y="${bot}" fill="var(--rep)" font-size="9">R</text>
    <text x="1" y="${mid + 3}" fill="var(--ink3)" font-size="8">50</text>

  const swing = swsum / wsum;

}

  requestAnimationFrame(() => { if (typeof fitEmbed === 'function') fitEmbed(); if (S) renderView(); });
}
$('#uictl').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ui')) || 1;
  setUi(b.dataset.ui === '+' ? cur + 0.1 : b.dataset.ui === '-' ? cur - 0.1 : 1);
});
{ const saved = store.get('ui'); const q = parseFloat(Q.get('ui')); if (!isNaN(q)) setUi(q); else if (saved) setUi(saved); }

// full screen: standard API with the WebKit-prefixed fallback Safari still uses
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  const active = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if (active) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  } catch (e) { clientError('page', 'full screen: ' + e.message); }
}
$('#fullscreen').addEventListener('click', toggleFullscreen);
for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, () => { $('#fullscreen').classList.toggle('on', !!(document.fullscreenElement || document.webkitFullscreenElement)); requestAnimationFrame(fitEmbed); });
document.addEventListener('keydown', e => {
  if (e.target.closest && (e.target.closest('[contenteditable]') || e.target.closest('input, textarea, select'))) return;
  if (e.key === 't') setTheater(!document.body.classList.contains('theater'));
  if (e.key === 'g') showGame(!document.body.classList.contains('gameopen'));
  if (e.key === 'Escape' && document.body.classList.contains('gameopen')) showGame(false);
  if (e.key === 'f') toggleFullscreen();
});

// ------------------------------------------------------------ resizable regions
// Each handle sets one CSS variable on :root (px) and persists it. Double-click resets.
const RZ = {
  'rz-cols':  { axis: 'x', get: () => $('#left').getBoundingClientRect().width, min: 240, maxFn: () => window.innerWidth - 260, cssVar: () => '--left-w', key: () => 'rz:left-w' },
  'rz-cols-theater': { axis: 'x', get: () => $('#left').getBoundingClientRect().width, min: 120, maxFn: () => window.innerWidth - 240, cssVar: () => '--side-w', key: () => 'rz:side-w', invert: true },
  'rz-races': { axis: 'y', get: () => $('#racewrap').getBoundingClientRect().height, min: 80, maxFn: () => $('#left').getBoundingClientRect().height - 90, cssVar: () => '--races-h', key: () => 'rz:races-h' },
  'rz-polls': { axis: 'y', get: () => $('#polls').getBoundingClientRect().height, min: 0, maxFn: () => $('#right').getBoundingClientRect().height - 200, cssVar: () => '--polls-h', key: () => 'rz:polls-h' },
};
function rzSpec(id) { return id === 'rz-cols' && document.body.classList.contains('theater') ? RZ['rz-cols-theater'] : RZ[id]; }
function applySavedSizes() {
  for (const [v, k] of [['--left-w', 'rz:left-w'], ['--races-h', 'rz:races-h'], ['--polls-h', 'rz:polls-h'], ['--side-w', 'rz:side-w']]) {
    const px = store.get(k); if (px !== null) document.documentElement.style.setProperty(v, px + 'px');
  }
}
document.querySelectorAll('.rz').forEach(h => {
  h.addEventListener('pointerdown', e => {
    const spec = rzSpec(h.id); if (!spec) return;
    e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add('active'); document.body.classList.add('resizing');
    const start = spec.axis === 'x' ? e.clientX : e.clientY, size0 = spec.get();
    const move = ev => {
      const d = (spec.axis === 'x' ? ev.clientX : ev.clientY) - start;
      const px = Math.max(spec.min, Math.min(spec.maxFn(), size0 + (spec.invert ? -d : d)));
      document.documentElement.style.setProperty(spec.cssVar(), px + 'px');
    };
    const up = () => {
      h.classList.remove('active'); document.body.classList.remove('resizing');
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      const cur = parseFloat(document.documentElement.style.getPropertyValue(spec.cssVar())); if (!isNaN(cur)) store.set(spec.key(), Math.round(cur));
      if (view === 'map') renderMap();
    };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  });
  h.addEventListener('dblclick', () => { const spec = rzSpec(h.id); if (!spec) return; document.documentElement.style.removeProperty(spec.cssVar()); store.set(spec.key(), null); });
});
applySavedSizes();

// table columns: drag the handle on a header cell. Widths are stored by header
// label so they survive reordering and theater mode hiding some columns.
const raceTable = $('#races table');
const visibleThs = () => Array.from(raceTable.querySelectorAll('thead th')).filter(th => th.offsetParent !== null);
const thLabel = th => th.firstChild.textContent.trim();
function applyColWidths() {
  const saved = store.get('rz:colw');
  const ths = Array.from(raceTable.querySelectorAll('thead th'));
  if (!saved) { raceTable.classList.remove('fixed'); raceTable.style.width = ''; ths.forEach(th => th.style.width = ''); return; }
  raceTable.classList.add('fixed');
  let sum = 0;
  for (const th of visibleThs()) { const w = saved[thLabel(th)]; if (w) { th.style.width = w + 'px'; sum += w; } else { th.style.width = ''; sum += th.getBoundingClientRect().width || 80; } }
  raceTable.style.width = Math.round(sum) + 'px';
}
raceTable.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('.cr'); if (!h) return;
  e.preventDefault(); e.stopPropagation();
  const th = h.parentElement, ths = visibleThs();
  const widths = new Map(ths.map(t => [t, t.getBoundingClientRect().width]));
  ths.forEach(t => t.style.width = widths.get(t) + 'px');
  raceTable.classList.add('fixed');
  const x0 = e.clientX, w0 = widths.get(th);
  h.setPointerCapture(e.pointerId); h.classList.add('active'); document.body.classList.add('resizing');
  const move = ev => {
    const w = Math.max(28, w0 + ev.clientX - x0);
    widths.set(th, w); th.style.width = w + 'px';
    raceTable.style.width = Math.round(Array.from(widths.values()).reduce((a, b) => a + b, 0)) + 'px';
  };
  const up = () => {
    h.classList.remove('active'); document.body.classList.remove('resizing'); colDragged = true; setTimeout(() => colDragged = false, 50);
    h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
    const saved = store.get('rz:colw') || {};
    for (const [t, w] of widths) saved[thLabel(t)] = Math.round(w);
    store.set('rz:colw', saved);
  };
  h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
});
// double-click a handle: fit the column to its widest cell (measured off-screen, so clipped text counts)
raceTable.addEventListener('dblclick', e => {
  const h = e.target.closest && e.target.closest('.cr'); if (!h) return;
  e.stopPropagation();
  const th = h.parentElement, ths = visibleThs(), idx = ths.indexOf(th);
  const probe = document.createElement('div'); probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;left:-9999px;top:0'; probe.style.font = getComputedStyle(th).font; document.body.appendChild(probe);
  let w = 0;
  probe.innerHTML = th.querySelector('.hl').textContent; w = Math.max(w, probe.offsetWidth + 14);
  for (const tr of raceTable.querySelectorAll('tbody tr')) { const td = tr.children[idx]; if (!td) continue; probe.innerHTML = td.innerHTML; w = Math.max(w, probe.offsetWidth); }
  probe.remove();
  const pad = 2 * parseFloat(getComputedStyle(th).paddingLeft || 8) + 4;
  const widths = new Map(ths.map(t => [t, t.getBoundingClientRect().width])); widths.set(th, Math.max(28, Math.ceil(w + pad)));
  raceTable.classList.add('fixed'); ths.forEach(t => t.style.width = widths.get(t) + 'px');
  raceTable.style.width = Math.round(Array.from(widths.values()).reduce((a, b) => a + b, 0)) + 'px';
  const saved = store.get('rz:colw') || {}; for (const [t, ww] of widths) saved[thLabel(t)] = Math.round(ww); store.set('rz:colw', saved);
});
renderHead();
applyColWidths();
if (store.get('theater') || Q.get('theater') === '1') setTheater(true);

// named setups: every en26:* preference except per-race edits and the game identity, saved to the server
function collectPrefs() { const out = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('en26:') && !k.startsWith('en26:edit:') && k !== 'en26:game:me') out[k] = localStorage.getItem(k); } } catch {} return out; }
$('#savesetup').addEventListener('click', async () => {
  const name = (prompt('Name for this setup (letters, numbers, dashes). Load it on any device with ?setup=name', store.get('setupName') || 'tv') || '').replace(/[^\w-]/g, '');
  if (!name) return;
  try { const r = await fetch('/api/setup?name=' + encodeURIComponent(name), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prefs: collectPrefs() }) }); if (!r.ok) throw new Error('HTTP ' + r.status); store.set('setupName', name); $('#savesetup').textContent = 'Saved ' + name; setTimeout(() => $('#savesetup').textContent = 'Save setup', 2500); }
  catch (e) { clientError('page', 'save setup: ' + e.message); }
});
if (Q.get('setup')) (async () => {
  try { const r = await fetch('/api/setup?name=' + encodeURIComponent(Q.get('setup'))); if (!r.ok) throw new Error('no setup named ' + Q.get('setup')); const j = await r.json();
    for (const [k, v] of Object.entries(j.prefs || {})) localStorage.setItem(k, v);
    location.replace(location.pathname + location.search.replace(/[?&]setup=[^&]*/, '').replace(/^&/, '?'));
  } catch (e) { clientError('page', e.message); }
})();
$('#resetlayout').addEventListener('click', () => {
  for (const k of ['rz:left-w', 'rz:races-h', 'rz:polls-h', 'rz:side-w', 'rz:colw', 'cols:order', 'cols:hidden:normal', 'cols:hidden:theater', 'cols:hidden:phone']) store.set(k, null);
  for (const v of ['--left-w', '--races-h', '--polls-h', '--side-w']) document.documentElement.style.removeProperty(v);
  renderHead(); renderRaces();
  if (view === 'map') renderMap();
});
